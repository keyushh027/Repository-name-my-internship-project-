<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — KaryaSpace</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f7f8fa;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-container {
      background: #fff;
      border: 0.5px solid #e0e0e0;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.02);
    }
    .brand { text-align: center; margin-bottom: 2rem; }
    .brand .logo { font-size: 18px; font-weight: 600; color: #111; letter-spacing: -0.02em; }
    .role-badge {
      display: inline-block; font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 12px;
      background: #E6F1FB; color: #185FA5; border: 0.5px solid #378ADD; margin-top: 6px;
    }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 12px; font-weight: 500; color: #666; margin-bottom: 6px; }
    .input-wrapper { position: relative; }
    .input-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #999; font-size: 16px; }
    .input-wrapper input {
      width: 100%; padding: 10px 12px 10px 36px; font-size: 14px; border-radius: 8px;
      border: 0.5px solid #ccc; background: #fff; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-wrapper input:focus { border-color: #378ADD; box-shadow: 0 0 0 3px rgba(55, 138, 221, 0.12); }
    .form-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; font-size: 13px; }
    .remember-me { display: flex; align-items: center; gap: 6px; color: #666; cursor: pointer; }
    .forgot-link { color: #378ADD; text-decoration: none; }
    .forgot-link:hover { text-decoration: underline; }
    .submit-btn {
      display: block; width: 100%; padding: 11px 0; font-size: 14px; font-weight: 500; border-radius: 8px;
      border: none; background: #378ADD; color: #fff; cursor: pointer; margin-top: 1.75rem; transition: opacity 0.15s;
    }
    .submit-btn:hover { opacity: 0.9; }
    .back-to-portal { display: block; text-align: center; font-size: 12px; color: #999; margin-top: 1.5rem; text-decoration: none; }
    .back-to-portal:hover { color: #666; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="brand">
      <div class="logo">KaryaSpace</div>
      <span class="role-badge">System Administrator</span>
    </div>

    <form onsubmit="event.preventDefault(); window.location.href='admin_ui.html';">
      <div class="form-group">
        <label for="email">Admin Email</label>
        <div class="input-wrapper">
          <i class="ti ti-mail"></i>
          <input type="email" id="email" placeholder="name@karyaspace.com" required value="admin@karyaspace.com">
        </div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="ti ti-lock"></i>
          <input type="password" id="password" placeholder="••••••••" required value="admin123">
        </div>
      </div>
      <div class="form-actions">
        <label class="remember-me"><input type="checkbox"> Remember device</label>
        <a href="#" class="forgot-link">Reset keys?</a>
      </div>
      <button type="submit" class="submit-btn">Verify & Secure Access</button>
    </form>
    <a href="index.html" class="back-to-portal">← Change Selection</a>
  </div>
</body>
</html>
