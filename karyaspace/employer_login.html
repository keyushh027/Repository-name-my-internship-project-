<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Employer Portal — KaryaSpace</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif; background: #f7f8fa; color: #1a1a1a;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2.5rem 1.5rem;
    }
    .auth-container {
      background: #fff; border: 0.5px solid #e0e0e0; border-radius: 16px; padding: 2.5rem 2rem;
      max-width: 440px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.02);
    }
    .brand { text-align: center; margin-bottom: 1.5rem; }
    .brand .logo { font-size: 18px; font-weight: 600; color: #111; }
    .role-badge {
      display: inline-block; font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 12px;
      background: #E1F5EE; color: #0F6E56; border: 0.5px solid #1D9E75; margin-top: 6px;
    }
    .auth-tabs { display: flex; border-bottom: 1px solid #eee; margin-bottom: 2rem; }
    .tab-btn {
      flex: 1; background: none; border: none; padding: 10px 0; font-size: 14px; font-weight: 500;
      color: #888; cursor: pointer; text-align: center; transition: color 0.15s; position: relative;
    }
    .tab-btn.active { color: #0F6E56; }
    .tab-btn.active::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px; background: #1D9E75; }
    .form-section { display: none; }
    .form-section.active { display: block; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 12px; font-weight: 500; color: #666; margin-bottom: 6px; }
    .input-wrapper { position: relative; }
    .input-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #999; font-size: 16px; }
    .input-wrapper input, .input-wrapper select {
      width: 100%; padding: 10px 12px 10px 36px; font-size: 14px; border-radius: 8px; border: 0.5px solid #ccc;
      background: #fff; outline: none; transition: border-color 0.2s, box-shadow 0.2s; font-family: inherit;
    }
    .input-wrapper select { appearance: none; -webkit-appearance: none; cursor: pointer; }
    .input-wrapper input:focus, .input-wrapper select:focus { border-color: #1D9E75; box-shadow: 0 0 0 3px rgba(29, 158, 117, 0.12); }
    .form-utility { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; font-size: 13px; }
    .submit-btn {
      display: block; width: 100%; padding: 11px 0; font-size: 14px; font-weight: 500; border-radius: 8px;
      border: none; background: #1D9E75; color: #fff; cursor: pointer; margin-top: 1.75rem; transition: opacity 0.15s;
    }
    .submit-btn:hover { opacity: 0.9; }
    .back-link { display: block; text-align: center; font-size: 12px; color: #999; margin-top: 1.5rem; text-decoration: none; }
    .back-link:hover { color: #666; }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="brand">
      <div class="logo">KaryaSpace</div>
      <span class="role-badge">Employer Workspace</span>
    </div>

    <div class="auth-tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn" onclick="switchTab('register')">Register Company</button>
    </div>

    <div id="login-section" class="form-section active">
      <form onsubmit="event.preventDefault(); window.location.href='employer_ui.html';">
        <div class="form-group">
          <label for="login-identity">E-mail / Phone</label>
          <div class="input-wrapper">
            <i class="ti ti-briefcase"></i>
            <input type="text" id="login-identity" placeholder="Enter work email or phone" required value="recruiter@acme.com">
          </div>
        </div>
        <div class="form-group">
          <label for="login-pass">Password</label>
          <div class="input-wrapper">
            <i class="ti ti-lock"></i>
            <input type="password" id="login-pass" placeholder="••••••••" required value="employer123">
          </div>
        </div>
        <div class="form-utility">
          <label style="display: flex; align-items: center; gap: 6px; color:#666; cursor: pointer;">
            <input type="checkbox"> Stay logged in
          </label>
          <a href="#" style="color: #1D9E75; text-decoration: none;">Forgot password?</a>
        </div>
        <button type="submit" class="submit-btn">Sign In</button>
      </form>
    </div>

    <div id="register-section" class="form-section">
      <form onsubmit="event.preventDefault(); alert('Registering Employer Account...'); window.location.href='employer_ui.html';">
        <div class="form-group">
          <label for="reg-org">Organization / Business Name</label>
          <div class="input-wrapper">
            <i class="ti ti-building"></i>
            <input type="text" id="reg-org" placeholder="Company legal title" required>
          </div>
        </div>
        <div class="form-group">
          <label for="reg-email">E-mail</label>
          <div class="input-wrapper">
            <i class="ti ti-mail"></i>
            <input type="email" id="reg-email" placeholder="corporate@firm.com" required>
          </div>
        </div>
        <div class="form-group">
          <label for="reg-phone">Phone</label>
          <div class="input-wrapper">
            <i class="ti ti-phone"></i>
            <input type="tel" id="reg-phone" placeholder="Official contact number" required>
          </div>
        </div>
        <div class="form-group">
          <label for="reg-pass">Password</label>
          <div class="input-wrapper">
            <i class="ti ti-lock"></i>
            <input type="password" id="reg-pass" placeholder="Create secure workspace password" required>
          </div>
        </div>
        <div class="form-group">
          <label for="reg-category">Business Category</label>
          <div class="input-wrapper">
            <i class="ti ti-category"></i>
            <select id="reg-category" required>
              <option value="" disabled selected>Select industrial sector...</option>
              <option value="tech">Technology & Infrastructure</option>
              <option value="finance">Banking & Financial Services</option>
              <option value="healthcare">Medical & Healthcare</option>
              <option value="education">Education & Academics</option>
              <option value="manufacturing">Manufacturing & Logistics</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="reg-location">Location</label>
          <div class="input-wrapper">
            <i class="ti ti-map-pin"></i>
            <input type="text" id="reg-location" placeholder="City, State" required>
          </div>
        </div>
        <div class="form-group">
          <label for="reg-aadhar">Aadhar no</label>
          <div class="input-wrapper">
            <i class="ti ti-file-text"></i>
            <input type="text" id="reg-aadhar" placeholder="12-digit identification number" required>
          </div>
        </div>
        <button type="submit" class="submit-btn">Register Enterprise</button>
      </form>
    </div>

    <a href="index.html" class="back-link">← Change Selection</a>
  </div>

  <script>
    function switchTab(type) {
      const tabs = document.querySelectorAll('.tab-btn');
      const sections = document.querySelectorAll('.form-section');
      tabs.forEach(t => t.classList.remove('active'));
      sections.forEach(s => s.classList.remove('active'));
      if(type === 'login') {
        tabs[0].classList.add('active');
        document.getElementById('login-section').classList.add('active');
      } else {
        tabs[1].classList.add('active');
        document.getElementById('register-section').classList.add('active');
      }
    }
  </script>
</body>
</html>
